services:
  craftora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: craftora
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - craftora_uploads:/app/public/uploads
      - craftora_images:/app/storage/images
    networks:
      - craftora-web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=craftora-web"
      - "traefik.http.routers.craftora.rule=Host(`craftora.dev`) || Host(`www.craftora.dev`) || Host(`download.craftora.dev`) || Host(`go.craftora.dev`) || Host(`img.craftora.dev`)"
      - "traefik.http.routers.craftora.entrypoints=websecure"
      - "traefik.http.routers.craftora.tls=true"
      - "traefik.http.routers.craftora.tls.certresolver=letsencrypt"
      - "traefik.http.services.craftora.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.craftora-hsts.headers.stsSeconds=31536000"
      - "traefik.http.routers.craftora.middlewares=craftora-hsts"

networks:
  craftora-web:
    name: craftora-web

volumes:
  craftora_uploads:
  craftora_images:
